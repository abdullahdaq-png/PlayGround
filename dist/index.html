<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <title>IRON PROTOCOL — 5v5 Online FPS</title>
    <meta name="description" content="IRON PROTOCOL: 10 harita, 4 operatör, 5v5 online taktik FPS. Maç ödülleriyle silah skinleri aç." />
    <script type="module" crossorigin src="./assets/index-B5smrOqR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D8els_-d.css">
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="vignette"></div>
      <div id="scanlines"></div>
      <div id="ui"></div>
      <div id="touch-controls" aria-hidden="true">
        <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
        <div class="touch-cluster">
          <button class="tbtn" data-touch="reload">⟳</button>
          <button class="tbtn" data-touch="ability">✦</button>
          <button class="tbtn" data-touch="jump">⤒</button>
        </div>
        <div class="touch-cluster right">
          <button class="tbtn fire" data-touch="fire">●</button>
          <button class="tbtn" data-touch="ads">◎</button>
          <button class="tbtn" data-touch="swap">⇄</button>
        </div>
      </div>
      <div id="rotate-hint">En iyi deneyim için telefonu yatay tut.</div>
    </div>
  </body>
</html>
